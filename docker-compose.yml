name: q16-lakehouse

services:
  # каталог iceberg хранит указатели на metadata.json в postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg_catalog
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iceberg"]
      interval: 5s
      retries: 20

  # s3-совместимое объектное хранилище (minio больше не публикует образы)
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024 -volume.max=0
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - sw-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9333/cluster/status >/dev/null"]
      interval: 5s
      retries: 30

  create-bucket:
    image: chrislusf/seaweedfs:3.80
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      sh -c "sleep 3 && echo 's3.bucket.create -name warehouse' | weed shell -master=seaweedfs:9333"
    restart: "no"

  trino:
    image: trinodb/trino:476
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    mem_limit: 9g

volumes:
  pg-data:
  sw-data:
